name: Build PianiPia V8 Executable

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Standalone Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydirectinput pyautogui pynput pillow mido supabase

      - name: Install Electron Dependencies
        working-directory: ./Electron
        run: |
          npm install

      - name: Build PianiPia V8 Executables (Portable & Setup)
        working-directory: ./Electron
        run: |
          npx electron-builder --win

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PianiPia-V8-Windows-x64
          path: Electron/dist/*.exe
          if-no-files-found: error

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Electron/dist/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
